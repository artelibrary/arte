<title>arte 검색 결과 · 스크롤 모션 미리보기</title>
<style>
/* ------------------------------------------------------------------
   A scroll-driven port of the `arte-search` Remotion composition.

   Both states of the page are single 1920px-wide renders exported from
   Figma, and every animated element is a window onto one of them:

     .m   a mask fixed at the element's page coordinates
      i   the render itself, offset so the crop lands in the mask,
           and the thing that actually moves

   Page landmarks: header 0-143 (pinned), search bar 143-401, AI panel
   at y401 (753px while loading, 1301px once answered), card rows at
   y738 / y1168, pagination y1598, 키워드 검색 결과 y1785, then
   문서·도서 y1994, 영상 y2476, 추천 y2873, 지역 y3240.

   The AI panel plays on load, on the timeline the composition used
   (frame / 30 = seconds). Everything below it waits for the viewport.
   ------------------------------------------------------------------ */
*{margin:0;padding:0;box-sizing:border-box}
html{background:#e9e9ec}
body{font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
     color:#111;overflow-x:hidden}

#root{width:1920px;margin:0 auto;transform-origin:top center}
#stick{position:sticky;top:0;height:0;z-index:50;overflow:visible}
#page{position:relative;width:1920px;height:3648px;background:#fff}

/* ---- crop windows ------------------------------------------------ */
.m{position:absolute;overflow:hidden;
   top:calc(var(--t)*1px);left:calc(var(--l)*1px);
   width:calc(var(--w)*1px);height:calc(var(--h)*1px)}
.m>i{position:absolute;top:0;left:0;width:100%;height:100%;
     background-image:url(arte-search/page-loaded.png);
     background-size:1920px auto;background-repeat:no-repeat;
     background-position:calc(var(--l)*-1px) calc(var(--t)*-1px)}
.m.lo>i{background-image:url(arte-search/page-loading.png)}

/* text and blocks rise out of their own mask, bottom to top */
.rise>i{transform:translateY(calc(var(--h)*1px));opacity:0;
        transition:transform .733s cubic-bezier(.16,1,.3,1),opacity .467s ease-out;
        transition-delay:var(--d,0s)}
.rise.in>i{transform:none;opacity:1}

/* images settle from 120% down to 100% inside a fixed frame */
.zoom>i{transform:scale(1.2);opacity:0;
        transition:transform 1.467s cubic-bezier(.16,1,.3,1),opacity .6s ease-out;
        transition-delay:var(--d,0s)}
.zoom.in>i{transform:none;opacity:1}

/* the skeleton appears in place - no movement, opacity only */
.fade>i{opacity:0;transition:opacity var(--dur,1.067s) ease-out;transition-delay:var(--d,0s)}
.fade.in>i{opacity:1}

/* ---- the AI panel ----------------------------------------------- */
#panel{position:absolute;top:401px;left:160px;width:1600px;height:0;
       background:#f5f5f5;transition:height .867s cubic-bezier(.16,1,.3,1)}
#loading{transition:opacity .6s ease-out}
#loading.gone{opacity:0}

/* ---- card outlines ---------------------------------------------- */
/* Four 1px rules drawn back to back from the top-left corner, running
   anti-clockwise, each timed to its own length so the pen keeps a
   constant speed the whole way round. */
.olb{position:absolute;top:calc(var(--t)*1px);left:calc(var(--l)*1px);
     width:calc(var(--w)*1px);height:calc(var(--h)*1px);pointer-events:none}
.ol{position:absolute;background:#000;transition:clip-path .233s linear}
.e1{left:0;top:0;width:1px;height:100%;clip-path:inset(0 0 100% 0);
    transition-delay:calc(var(--d,0s));transition-duration:.233s}
.e2{left:0;bottom:0;width:100%;height:1px;clip-path:inset(0 100% 0 0);
    transition-delay:calc(var(--d,0s) + .233s);transition-duration:.4s}
.e3{right:0;top:0;width:1px;height:100%;clip-path:inset(100% 0 0 0);
    transition-delay:calc(var(--d,0s) + .633s);transition-duration:.233s}
.e4{left:0;top:0;width:100%;height:1px;clip-path:inset(0 0 0 100%);
    transition-delay:calc(var(--d,0s) + .867s);transition-duration:.4s}
.olb.in .ol{clip-path:inset(0 0 0 0)}

/* ---- the pinned header ------------------------------------------ */
#hdr{position:absolute;top:0;left:0;width:1920px;height:143px;overflow:hidden}
#hdr .bar{position:absolute;top:0;left:0;width:1920px;height:42px;overflow:hidden}
#hdr .bar>i,#hdr .nav>i,#hdr .ico>i{position:absolute;top:0;left:0;width:100%;height:100%;
  background-image:url(arte-search/page-loaded.png);background-size:1920px auto;
  background-repeat:no-repeat}
#hdr .bar>i{background-position:0 0}
#hdr .plate{position:absolute;top:66px;left:147px;width:245px;height:51px;
  background:#000;overflow:hidden;
  transition:left 1.067s cubic-bezier(.33,1,.68,1),width 1.067s cubic-bezier(.33,1,.68,1)}
#hdr .white{position:absolute;top:42px;left:0;width:1920px;height:101px;background:#fff}
#hdr .nav{position:absolute;top:42px;left:400px;width:1285px;height:101px;overflow:hidden;
  transition:opacity .6s ease-out}
#hdr .nav>i{background-position:-400px -42px}
#hdr .ico{position:absolute;top:42px;left:1685px;width:105px;height:101px;overflow:hidden}
#hdr .ico>i{background-position:-1685px -42px}
#hdr .word,#hdr .mark{position:absolute;top:0;left:0;height:51px;overflow:hidden}
#hdr .word{width:245px;transition:opacity .533s ease-out}
#hdr .mark{width:51px;opacity:0;transition:opacity .733s ease-out .4s}
#hdr .word>i,#hdr .mark>i{position:absolute;top:0;left:0;width:1920px;height:143px;
  background-size:1920px auto;background-repeat:no-repeat}
#hdr .word>i{background-image:url(arte-search/page-loaded.png);background-position:-147px -66px}
#hdr .mark>i{background-image:url(arte-search/header-scrolled.png);background-position:-150px -66px}
/* scrolled: the plate closes leftwards into a square, the wordmark is
   clipped away by that shrink as it fades, the mark fades in behind it,
   and the nav and account pill go. The icons on the right belong to both
   states and never move, so they are drawn once. */
#root.scrolled #hdr .plate{left:150px;width:51px}
#root.scrolled #hdr .word{opacity:0}
#root.scrolled #hdr .mark{opacity:1}
#root.scrolled #hdr .nav{opacity:0}

/* 문서·도서 in the nav links out to the arte-document page. The hit area is
   that item's own flex box - the label ink x510-596 plus its 40px padding
   either side - and the rule on hover spans just the label. The link is
   relative so it resolves the same over file:// and over the dev server. */
#hdr .navlink{position:absolute;left:470px;top:72px;width:167px;height:40px;
  display:block;cursor:pointer;transition:opacity .6s ease-out}
#hdr .navlink b{position:absolute;left:40px;right:40px;bottom:1px;height:2px;
  background:#000;transform:scaleX(0);transform-origin:left center;
  transition:transform .28s cubic-bezier(.33,1,.68,1)}
#hdr .navlink:hover b{transform:scaleX(1)}
/* the nav is gone once collapsed, so the hit area has to go with it */
#root.scrolled #hdr .navlink{opacity:0;pointer-events:none}

/* The wordmark (content/group) goes back to the document screen. It lives
   inside the plate, which is overflow:hidden, so the hit area is clipped to
   whatever the plate currently is - the full lockup before the collapse,
   the 51px square after it - and stays live in both states. */
#hdr .home{position:absolute;top:0;left:0;width:100%;height:100%;
  display:block;cursor:pointer;z-index:2}

/* ---- viewer chrome --------------------------------------------- */
#ui{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;gap:8px;align-items:center}
#ui button{font:500 13px/1 inherit;color:#fff;background:rgba(17,17,17,.86);
  border:0;border-radius:999px;padding:11px 16px;cursor:pointer;
  backdrop-filter:blur(6px)}
#ui button:hover{background:#ff2268}
#hint{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:200;
  font:500 13px/1 inherit;color:#fff;background:rgba(17,17,17,.8);
  border-radius:999px;padding:11px 18px;transition:opacity .4s ease-out}
#hint.gone{opacity:0;pointer-events:none}
</style>

<script>
const root = document.getElementById('root');
const page = document.getElementById('page');
const panel = document.getElementById('panel');
const loading = document.getElementById('loading');

/* The design is a fixed 1920px wide. Scale it down to fit narrower windows,
   but never up - the page renders are 1x, so enlarging them only softens
   the type.

   This uses `zoom` rather than `transform: scale()` on purpose: zoom feeds
   into layout, so the document scroll height follows on its own and the
   sticky header still pins against the real viewport. A transform would
   leave sticky resolving in unscaled space and the header would drift. */
function fit() {
  const s = Math.min(1, window.innerWidth / 1920);
  root.style.zoom = s;
  return s;
}
let scale = fit();
addEventListener('resize', () => { scale = fit(); });

/* ---- the AI panel load sequence -------------------------------------
   Same beats the composition used, converted from frames at 30fps:
   the panel opens to the skeleton height, holds there, then grows on to
   its answered height as the placeholder fades and the answer arrives. */
let timers = [];
function playLoad() {
  timers.forEach(clearTimeout); timers = [];
  loading.classList.remove('gone');
  panel.style.transition = 'none';
  panel.style.height = '0px';
  document.querySelectorAll('#loading .m, #answer .m').forEach(e => e.classList.remove('in'));
  document.querySelectorAll('#answer .olb').forEach(e => e.classList.remove('in'));
  void panel.offsetHeight;                        // flush, so the reset is not animated away

  const at = (f, fn) => timers.push(setTimeout(fn, f / 30 * 1000));
  at(8, () => {
    panel.style.transition = 'height .867s cubic-bezier(.16,1,.3,1)';
    panel.style.height = '753px';
  });
  at(118, () => {
    panel.style.transition = 'height .933s cubic-bezier(.16,1,.3,1)';
    panel.style.height = '1301px';
  });
  at(108, () => loading.classList.add('gone'));
  // every element carries its own transition-delay, so one class is enough
  requestAnimationFrame(() => {
    document.querySelectorAll('#loading .m, #answer .m, #answer .olb')
      .forEach(e => e.classList.add('in'));
  });
}
playLoad();
document.getElementById('replay').addEventListener('click', playLoad);

/* ---- viewport-triggered reveals ------------------------------------ */
/* The margin holds each reveal back until the element is properly inside
   the viewport rather than clipping its bottom edge. */
const pending = new Set(document.querySelectorAll('[data-scroll] .m, [data-scroll] .olb'));
const reveal = (el) => { el.classList.add('in'); pending.delete(el); io.unobserve(el); };
const io = new IntersectionObserver((entries) => {
  for (const en of entries) if (en.isIntersecting) reveal(en.target);
}, { rootMargin: '0px 0px -12% 0px' });
pending.forEach((e) => io.observe(e));

/* That margin means the last elements on the page sit inside it while the
   scroll is already at the bottom, with nowhere further to go - they would
   never fire. Once the page bottom is reached, release whatever is left. */
function sweepBottom() {
  if (!pending.size) return;
  if (window.scrollY + window.innerHeight < document.documentElement.scrollHeight - 2) return;
  [...pending].forEach(reveal);
}

/* ---- header collapse ----------------------------------------------- */
const hint = document.getElementById('hint');
function onScroll() {
  const y = window.scrollY / scale;              // back into page coordinates
  root.classList.toggle('scrolled', y > 80);
  if (y > 40) hint.classList.add('gone');
  sweepBottom();
}
addEventListener('scroll', onScroll, { passive: true });
onScroll();

function at(px,py){
  const s = parseFloat(getComputedStyle(document.getElementById("root")).zoom)||1;
  const r = document.elementFromPoint(px*s - scrollX, py*s - scrollY);
  if(!r) return "nothing";
  const a = r.closest("a");
  return a ? ("LINK -> "+a.getAttribute("href")) : (r.tagName+"."+(r.className||"-"));
}
window.scrollTo(0,400);dispatchEvent(new Event("scroll"));
document.title = at(170,90);
</script>
