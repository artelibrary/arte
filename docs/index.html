<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arte</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    background: #000;
    display: block;
  }
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.75rem;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  nav button {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.85rem;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  nav button:hover {
    border-color: rgba(255,255,255,0.7);
  }
  nav button.active {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .unmute {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 10;
    appearance: none;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.8rem;
    padding: 0.55rem 1rem;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
</style>
</head>
<body>
  <div class="stage">
    <video id="player" autoplay muted loop playsinline></video>
  </div>
  <nav>
    <button data-src="videos/document-library.mp4" data-label="문서도서">문서도서</button>
    <button data-src="videos/ai-search.mp4" data-label="AI 검색결과">AI 검색결과</button>
  </nav>
  <button class="unmute" id="unmute">🔇 음소거 해제</button>

  <script>
    const video = document.getElementById('player');
    const buttons = document.querySelectorAll('nav button');
    const unmuteBtn = document.getElementById('unmute');

    function setActive(btn) {
      buttons.forEach((b) => b.classList.toggle('active', b === btn));
    }

    function loadVideo(btn) {
      video.src = btn.dataset.src;
      video.play().catch(() => {});
      setActive(btn);
    }

    buttons.forEach((btn) => btn.addEventListener('click', () => loadVideo(btn)));

    unmuteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      unmuteBtn.textContent = video.muted ? '🔇 음소거 해제' : '🔊 음소거';
    });

    loadVideo(buttons[0]);
  </script>
</body>
</html>
