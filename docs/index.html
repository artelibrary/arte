<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arte 영상</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: #0b0b0c;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 2rem;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }
  section h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 0.75rem;
    color: #ddd;
  }
  video {
    width: 100%;
    max-width: 100%;
    border-radius: 8px;
    background: #000;
    display: block;
  }
</style>
</head>
<body>
  <h1>Arte 영상</h1>
  <main>
    <section>
      <h2>AI 검색결과</h2>
      <video controls preload="metadata" playsinline>
        <source src="videos/ai-search.mp4" type="video/mp4" />
      </video>
    </section>
    <section>
      <h2>문서도서</h2>
      <video controls preload="metadata" playsinline>
        <source src="videos/document-library.mp4" type="video/mp4" />
      </video>
    </section>
  </main>
</body>
</html>
