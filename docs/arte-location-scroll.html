<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>arte 지역별 정보 · 스크롤 모션 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
/* ------------------------------------------------------------------
   A scroll-driven port of the `arte-location` Remotion composition.

   The whole screen is one 1920x1808 render exported from Figma, and
   every animated element is a window onto it:

     .m   a mask fixed at the element's page coordinates
      i   the render itself, offset so the crop lands in the mask,
           and the thing that actually moves

   Anything no window covers stays white, which is what lets the filter
   rail's rules be drawn as their own elements rather than arrive baked
   into the render.

   Durations are the composition's frame counts at 30fps, so a 30-frame
   reveal is 1s here. Text takes one line at a time, ~7 frames apart; the
   card grid is the exception, a row of three landing as one beat.

   Text and lines are always separate reveals. A text window is cropped to
   the text alone, clear of whatever box it sits in, and that box's outline
   is drawn afterwards as its own four rules. So a text reveal only ever
   moves text, and a line only ever appears by being drawn - never riding
   up inside a crop, and never drawn on top of one already showing. The two
   solid plates (the 프로그램 tab, the 프로그램 누적 tile) have no outline of
   their own and so rise whole. In the composition the page glided on a fixed
   timeline; here the reader drives it, so the intro (frames 0-168, which
   played at scroll 0) runs on load and everything below the fold waits
   for the viewport instead.

   Page landmarks: header 0-133 (pinned), breadcrumb 153, title 257,
   tabs 377-457, 프로그램 557, rail 649-1728 (검색 649, rule 780, 지역 808,
   map 832-1276, caption 1307, rules 1380/1475/1570/1726, 장르 1422,
   교육대상 1517, 운영기간 1612), count row 649, tiles 712-832, note 912,
   card rows 960 / 1175 / 1391, pagination 1660.
   ------------------------------------------------------------------ */
*{margin:0;padding:0;box-sizing:border-box}
html{background:#e9e9ec}
body{font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
     color:#111;overflow-x:hidden}

#root{width:1920px;margin:0 auto}
#stick{position:sticky;top:0;height:0;z-index:50;overflow:visible}
#page{position:relative;width:1920px;background:#fff;display:flow-root}

/* ---- everything from "프로그램" down: no per-element choreography,
   just one fade-in once the header/title/tabs above have settled - real
   text/markup matching the current Figma design (positions had drifted
   ~80px out of sync with the old page.png crop windows). Only the intro
   above (breadcrumb/title/tabs) keeps its own reveal. ---- */
#locContent{margin:557px 0 120px 160px;width:1600px;font-family:Pretendard,sans-serif;
  opacity:0;transition:opacity .8s ease-out;transition-delay:2.0s}
#locContent.in{opacity:1}
.loc-titlerow{display:flex;align-items:center;justify-content:space-between;
  padding-bottom:28px;border-bottom:4px solid #000}
.loc-titlerow img{display:block}
.loc-titledesc{font:20px/1.5 Pretendard;font-weight:500;color:#555;text-align:right;max-width:764px}
.loc-body{margin-top:80px;width:100%;
  display:flex;gap:120px;align-items:flex-start}

.loc-filter{width:292px;flex:none;display:flex;flex-direction:column}
/* gaps between the sidebar's own blocks aren't uniform in the source -
   each is its own padding-plus-gap combination, so they're set as
   explicit margins here rather than one flex gap */
.lf-block-region{margin-top:64px}
.loc-accordion{margin-top:44px}
.lf-block-period{margin-top:44px}
.lf-label{font:16px/1.5 Pretendard;font-weight:500;color:#000;margin-bottom:16px}
.lf-block-region .lf-label{margin-bottom:0}
.lf-input{border:1px solid #000;padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;font:18px/1.5 Pretendard;font-weight:500;color:#888}
.lf-input img{width:20px;height:20px;flex:none}
.loc-map{margin:0 0 32px 0;border-radius:2px;overflow:hidden}
.loc-map img{display:block;width:100%}
.loc-note{display:flex;gap:6px;align-items:flex-start;font:14px/1.5 Pretendard;color:#000}
.loc-note img{width:20px;height:20px;flex:none}
.loc-accordion{display:flex;flex-direction:column;gap:12px;padding:18px 0}
.lf-row{display:flex;align-items:center;justify-content:space-between;
  font:23px/1.5 Pretendard;font-weight:700;color:#000;cursor:pointer}
.lf-row img{width:20px;height:20px;transform:rotate(90deg)}
.lf-daterange{display:flex;gap:8px;align-items:center;margin-top:16px}
.lf-daterange .lf-input{flex:1;min-width:0}
.lf-daterange img.divider{width:6px;flex:none}

.loc-list{flex:1;min-width:0;display:flex;flex-direction:column}
.loc-tiles{margin-top:24px}
.loc-more-row{margin-top:80px}
.loc-cards{margin-top:24px}
.loc-pagination{margin-top:80px}
.loc-listhead{display:flex;align-items:flex-end;justify-content:space-between}
.lh-left{display:flex;gap:40px}
.lh-count{font:18px/1.5 Pretendard;font-weight:500;color:#888;display:flex;gap:16px}
.lh-count b{font:20px/1.5 Pretendard;font-weight:600;color:#000;font-style:normal}
.lh-right{display:flex;gap:40px;align-items:center}
.lh-sort{font:18px/1.5 Pretendard;font-weight:500;color:#888;display:flex;align-items:center;gap:16px}
.lh-sort::after{content:"";width:1px;height:16px;background:#000;margin-left:16px}
.lh-sort:last-of-type::after{display:none}
.lh-sort.active{font-weight:600;color:#000}
.lh-perpage{font:18px/1.5 Pretendard;font-weight:600;color:#fff;background:#000;
  border:0;padding:6px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.lh-perpage::after{content:"⌄";font-size:14px}

.loc-tiles{display:flex}
.tile{flex:1;border:1px solid #000;padding:16px 0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;color:#000}
.tile-primary{background:#007ade;border-color:#007ade;color:#fff}
.tile-label{font:21px/1.5 Pretendard;font-weight:600;display:flex;gap:8px;align-items:baseline}
.tile-label small{font:20px/1.5 Pretendard;font-weight:400}
.tile strong{font:41px/1.2 Pretendard;font-weight:700;margin-top:2px}
.tile strong.blue{color:#007ade}

.loc-more-row{display:flex;align-items:flex-start;justify-content:space-between}
.loc-blue-note{font:18px/1.5 Pretendard;font-weight:500;color:#007ade}
.loc-more{font:16px/1.5 Pretendard;font-weight:500;color:#000;display:flex;gap:2px;
  align-items:center;cursor:pointer}
.loc-more::after{content:"›";font-size:16px}

.loc-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.loc-card{border:1px solid #000;display:flex;text-decoration:none;color:inherit;overflow:hidden}
.lc-thumb{width:132px;flex:none;align-self:stretch;background:#d9d9d9}
.lc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lc-body{flex:1;min-width:0;padding:20px;display:flex;flex-direction:column;gap:16px}
.lc-head{display:flex;flex-direction:column;gap:6px}
.lc-badge{background:#000;color:#fff;border:1.5px solid #000;padding:3px 12px;
  font:14px/1.5 Pretendard;font-weight:500;align-self:flex-start}
.lc-title{font:20px/1.5 Pretendard;font-weight:600;color:#000;margin:0}
.lc-desc{font:14px/1.5 Pretendard;font-weight:500;color:#555;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lc-tags{display:flex;flex-wrap:wrap;gap:4px 12px;font:14px/1.5 Pretendard;color:#000}

.loc-pagination{display:flex;gap:40px;align-items:center;justify-content:center}
.pg-arrow{border:0;background:none;font-size:20px;color:#000;cursor:pointer;line-height:1}
.pg-nums{display:flex;gap:12px}
.pg-num{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  font:18px/1.5 Pretendard;font-weight:500;color:#888;cursor:pointer}
.pg-num.active{background:#000;color:#fff}

/* ---- crop windows ------------------------------------------------ */
.m{position:absolute;overflow:hidden;
   top:calc(var(--t)*1px);left:calc(var(--l)*1px);
   width:calc(var(--w)*1px);height:calc(var(--h)*1px)}
.m>i{position:absolute;top:0;left:0;width:100%;height:100%;
     background-image:url(arte-location/page.png);background-size:1920px auto;
     background-repeat:no-repeat;
     background-position:calc(var(--l)*-1px) calc(var(--t)*-1px)}
/* standalone per-file crops (the 운영단체/지역별 자료 tabs - box and border
   exported as one image, same as document's tab buttons) */
.m>img{position:absolute;top:0;left:0;width:100%;display:block}

/* text rises out of its own mask, bottom to top - 30 frames */
.rise>i,.rise>img{transform:translateY(100%);
        transition:transform 1s cubic-bezier(.16,1,.3,1);
        transition-delay:var(--d,0s)}
.rise.in>i,.rise.in>img{transform:none}
/* the card copy is quicker, 26 frames */
.rise.quick>i,.rise.quick>img{transition-duration:.867s}
/* short labels settle in 28 */
.rise.label>i{transition-duration:.933s}

/* cover art settles from 120% to 100% inside a fixed crop - 40 frames */
.zoom>i{transform:scale(1.2);opacity:0;
        transition:transform 1.333s cubic-bezier(.16,1,.3,1),opacity .533s ease-out;
        transition-delay:var(--d,0s)}
.zoom.in>i{transform:none;opacity:1}

/* ---- filter rail rules, drawn left to right ---------------------- */
/* The rail has no panel behind it - the groups are separated by rules
   instead. One 4px section rule under 검색, then 1px dividers. */
.rule{position:absolute;background:var(--c,#000);
      top:calc(var(--t)*1px);left:calc(var(--l)*1px);
      width:calc(var(--w)*1px);height:calc(var(--h)*1px);
      clip-path:inset(0 100% 0 0);
      transition:clip-path 1s cubic-bezier(.16,1,.3,1) var(--d,0s)}
.rule.in{clip-path:inset(0 0 0 0)}
/* the tile box's divider and right edge run top to bottom instead */
.rule.v{clip-path:inset(0 0 100% 0)}
.rule.v.in{clip-path:inset(0 0 0 0)}

/* ---- drawn box outlines ------------------------------------------ */
/* Every box whose text reveals on its own gets its outline drawn here
   instead: four 1px rules back to back from the top-left corner, running
   anti-clockwise - down the left edge, across the bottom, up the right
   edge, then back along the top. 7 frames each, linear, so the pen keeps
   a constant speed the whole way round. The content window inside is
   always inset clear of these lines, so a line is only ever drawn and
   never rides up inside a text reveal. */
.olb{position:absolute;top:calc(var(--t)*1px);left:calc(var(--l)*1px);
     width:calc(var(--w)*1px);height:calc(var(--h)*1px);pointer-events:none}
.ol{position:absolute;background:#000;transition:clip-path .233s linear}
.e1{left:0;top:0;width:1px;height:100%;clip-path:inset(0 0 100% 0);
    transition-delay:var(--d,0s)}
.e2{left:0;bottom:0;width:100%;height:1px;clip-path:inset(0 100% 0 0);
    transition-delay:calc(var(--d,0s) + .233s)}
.e3{right:0;top:0;width:1px;height:100%;clip-path:inset(100% 0 0 0);
    transition-delay:calc(var(--d,0s) + .467s)}
.e4{left:0;top:0;width:100%;height:1px;clip-path:inset(0 0 0 100%);
    transition-delay:calc(var(--d,0s) + .700s)}
.olb.in .ol{clip-path:inset(0 0 0 0)}

/* ---- the pinned header -------------------------------------------
   Same header used on arte-document, just with its own hd-nav.png
   (지역별 정보 highlighted instead of 문서·도서) - per-file assets
   rather than a shared page.png crop, for consistency across pages. */
#hdr{position:absolute;top:0;left:0;width:1920px;height:133px}
#hdr .white{position:absolute;top:32px;left:0;width:1920px;height:101px;background:#fff}
#hdr .mast{position:absolute;top:0;left:0;width:1920px}
#hdr .nav{position:absolute;top:60px;left:459px;width:918px;transition:opacity .600s ease-in-out}
#hdr .acct{position:absolute;top:62px;left:1475px;width:201px;transition:opacity .600s ease-in-out}
#hdr .ico{position:absolute;top:66px;left:1690px;width:71px}
/* the wordmark sits in a mask that closes leftwards onto the square's
   footprint as it fades, so the closing edge wipes it away */
#hdr .word{position:absolute;display:block;top:66px;left:160px;width:200px;height:32px;
  overflow:hidden;
  transition:left 1s cubic-bezier(.16,1,.3,1),width 1s cubic-bezier(.16,1,.3,1)}
#hdr .word img{position:absolute;top:0;left:0;width:200px;display:block;
  transition:opacity .467s ease-in-out}
#hdr .mark{position:absolute;display:block;top:56px;left:150px;width:51px;opacity:0;
  transition:opacity .667s cubic-bezier(.5,1,.89,1) .200s}
#hdr img{display:block;width:100%}
#root.scrolled #hdr .word{left:150px;width:51px}
#root.scrolled #hdr .word img{opacity:0}
#root.scrolled #hdr .mark{opacity:1}
#root.scrolled #hdr .nav,#root.scrolled #hdr .acct{opacity:0}

/* ---- header links --------------------------------------------------
   Two navigations, both taken from the header itself rather than added
   as viewer chrome:
     the logo (imgi_10_logo) -> arte-main
     the search icon (mystery) -> arte-search
   The search icon sits at the same coordinates in both header states, so
   its hit area stays live after the collapse. The logo is two separate
   elements - the wordmark before the collapse, the square mark after - so
   both carry the link and it survives the swap. Hrefs are relative so they
   resolve the same over file:// and over the dev server. */
#hdr .icolink{position:absolute;left:1687px;top:63px;width:37px;height:37px;
  display:block;cursor:pointer;border-radius:999px;transition:background .2s ease-out}
#hdr .icolink:hover{background:rgba(0,0,0,.08)}
#hdr .word,#hdr .mark{cursor:pointer}
#hdr .word:hover img,#hdr .mark:hover img{opacity:.72}
/* "문서·도서" in the nav leads to the document screen. The item box is
   459-629 and the label sits 40px inside it either side, so the hover
   rule is inset to span just the words. Unlike the logo and the search
   icon the nav does not survive the collapse, so its hit area goes with it. */
#hdr .navlink{position:absolute;left:459px;top:62px;width:170px;height:40px;
  display:block;cursor:pointer;transition:opacity .600s ease-in-out}
#hdr .navlink b{position:absolute;left:40px;right:40px;bottom:1px;height:2px;
  background:#000;transform:scaleX(0);transform-origin:left center;
  transition:transform .28s cubic-bezier(.33,1,.68,1)}
#hdr .navlink:hover b{transform:scaleX(1)}
#root.scrolled #hdr .navlink{opacity:0;pointer-events:none}

/* ---- viewer chrome ----------------------------------------------- */
#ui{position:fixed;right:18px;bottom:18px;z-index:200}
#ui button{font:500 13px/1 inherit;color:#fff;background:rgba(17,17,17,.86);border:0;
  border-radius:999px;padding:11px 16px;cursor:pointer;backdrop-filter:blur(6px)}
#ui button:hover{background:#ff2268}
#hint{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:200;
  font:500 13px/1 inherit;color:#fff;background:rgba(17,17,17,.8);
  border-radius:999px;padding:11px 18px;transition:opacity .4s ease-out}
#hint.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>

<div id="root">
  <div id="stick">
    <div id="hdr">
      <div class="white"></div>
      <div class="mast"><img src="arte-location/hd-masthead.png" alt=""></div>
      <div class="nav"><img src="arte-location/hd-nav.png" alt=""></div>

      <div class="acct"><img src="arte-location/hd-account.png" alt=""></div>
      <div class="ico"><img src="arte-location/hd-icons.png" alt=""></div>
      <a class="icolink" href="arte-search-scroll.html" title="AI 검색 결과"></a>
      <a class="word" href="arte-main-scroll.html" title="arte 라이브러리 메인"
         aria-label="arte 라이브러리 메인"><img src="arte-location/hd-logo.png" alt=""></a>
      <a class="mark" href="arte-main-scroll.html" title="arte 라이브러리 메인"
         aria-label="arte 라이브러리 메인"><img src="arte-location/hd-mark.png" alt=""></a>
    </div>
  </div>

  <div id="page">

    <!-- ===== intro: composition frames 0-168, at scroll 0 ===== -->
    <div id="intro">
      <div class="m rise label" style="--l:160;--t:153;--w:241;--h:24;--d:0.200s"><i></i></div>
      <div class="m rise" style="--l:160;--t:257;--w:347;--h:69;--d:0.467s"><i></i></div>

      <!-- 프로그램 is a solid plate (still the shared page.png crop); 운영단체
           and 지역별 자료 are each exported whole - box, border and label as
           one image - so the box rises as a single unit instead of the
           border appearing separately from the text -->
      <div class="m rise" style="--l:160;--t:377;--w:528;--h:80;--d:0.733s"><i></i></div>
      <div class="m rise quick" style="--l:696;--t:377;--w:528;--h:80;--d:0.967s"><img src="arte-location/rebuild/tab-op.png" alt="운영단체"></div>
      <div class="m rise quick" style="--l:1232;--t:377;--w:528;--h:80;--d:1.200s"><img src="arte-location/rebuild/tab-loc.png" alt="지역별 자료"></div>

    </div>

    <!-- ===== everything from "프로그램" down: no per-element stagger,
         just one fade-in after the intro above has settled - real
         text/markup matching the current Figma design ===== -->
    <div id="locContent">
      <div class="loc-titlerow">
        <img src="arte-location/rebuild/heading-program.png" alt="프로그램" width="196" height="50">
        <p class="loc-titledesc">지역별 문화에술교육 프로그램 정보를 검색하고 조회할 수 있습니다.</p>
      </div>

        </div>
        <div class="lf-block-region">
          <p class="lf-label">지역</p>

          <div class="loc-note"><img src="arte-location/rebuild/icon-info.svg" alt="">다양한 조건을 설정하여 원하는 자료를 검색할 수 있습니다. (중복 선택 가능)</div>
        </div>

          </div>

      </aside>

      <div class="loc-list">

<script>
const root = document.getElementById('root');

/* The design is a fixed 1920px wide. Scale it down to fit narrower windows,
   but never up - the render is 1:1, so beyond that there is nothing to gain.

   This uses `zoom` rather than `transform: scale()` on purpose: zoom feeds
   into layout, so the document scroll height follows on its own and the
   sticky header still pins against the real viewport. A transform would
   leave sticky resolving in unscaled space and the header would drift. */
function fit() {
  const s = Math.min(1, window.innerWidth / 1920);
  root.style.zoom = s;
  return s;
}
let scale = fit();
addEventListener('resize', () => { scale = fit(); });

/* ---- the intro ------------------------------------------------------
   Every element carries its own transition-delay, taken from the frame it
   started on in the composition, so one class switch is enough. */
const introEls = document.querySelectorAll('#intro .m, #intro .rule, #intro .olb, #locContent');
function playIntro() {
  introEls.forEach(e => e.classList.remove('in'));
  void document.getElementById('page').offsetHeight;   // flush, so the reset is not animated away
  requestAnimationFrame(() => introEls.forEach(e => e.classList.add('in')));
}
playIntro();
document.getElementById('replay').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  playIntro();
});

/* ---- program listing cards: 9 identical entries (the source design
   uses the same placeholder copy for all of them), cycling through the
   4 available thumbnail photos for a little visual variety ---- */
const CARD_IMAGES = ['card-1.png', 'card-2.png', 'card-3.png', 'card-4.png'];
const cardsRoot = document.getElementById('locCards');
for (let i = 0; i < 9; i++) {
  const a = document.createElement('a');
  a.className = 'loc-card';
  a.href = '#';
  a.innerHTML = `
    <div class="lc-thumb"><img src="arte-location/rebuild/${CARD_IMAGES[i % CARD_IMAGES.length]}" alt=""></div>
    <div class="lc-body">
      <div class="lc-head">
        <span class="lc-badge">서울</span>
        <p class="lc-title">찾아-Dream(드림)</p>
      </div>
      <p class="lc-desc">연극을 통해 자신의 감정과 사회적 관계를 재발견하고, 삶의 이야기를 표현해보는 장년층(만 50세~64세) 대상...</p>
      <div class="lc-tags"><span>연극</span><span>중장년</span><span>2025</span><span>다름(DARM)</span></div>
    </div>`;
  cardsRoot.appendChild(a);
}

/* ---- header collapse ----------------------------------------------- */
const hint = document.getElementById('hint');
function onScroll() {
  const y = window.scrollY / scale;              // back into page coordinates
  root.classList.toggle('scrolled', y > 80);
  if (y > 40) hint.classList.add('gone');
}
addEventListener('scroll', onScroll, { passive: true });
onScroll();
</script>
</body>
</html>
